---
name: CI

on:
  pull_request:
  push:

jobs:
  test-package:
    name: Test and package on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry>=1.8,<2.0"

      - name: Install dependencies
        run: poetry install --with test --no-interaction

      - name: Check Poetry metadata
        run: poetry check

      - name: Run tests
        run: poetry run python -m pytest

      - name: Check package
        run: make package-check
